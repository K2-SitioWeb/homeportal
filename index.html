<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://store-eu-par-2.gofile.io/download/web/b3738ebe-fbff-4ae2-ac1b-7cd29c4b7af7/k2.png">
  <title>K2-Projects</title>
  <style>
    /* PALETA OPERA GX */
    :root {
      --bg-dark: #0f0f12;
      --bg-card: #18181c;
      --bg-card-hover: #222228;
      --primary-red: #ff1b44;
      --primary-red-glow: rgba(255, 27, 68, 0.35);
      --accent-yellow: #ffb703;
      --text-main: #f0f0f5;
      --text-muted: #a0a0ab;
      --border-color: #2a2a35;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background-color: #0b0b0e;
      border-bottom: 2px solid var(--primary-red);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px var(--primary-red-glow);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logo span { color: var(--primary-red); }
    .logo .dot { color: var(--accent-yellow); }

    .search-bar {
      display: flex;
      gap: 0.5rem;
      max-width: 450px;
      width: 100%;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary-red);
    }

    /* FILTROS */
    .categories {
      display: flex;
      gap: 0.8rem;
      padding: 1rem 2rem;
      background-color: #121216;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .cat-btn {
      background-color: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      color: var(--text-main);
      border-color: var(--primary-red);
      background-color: var(--bg-card-hover);
    }

    .cat-btn.active {
      background-color: var(--primary-red);
      color: white;
    }

    /* MAIN CONTENT */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 22px;
      background-color: var(--accent-yellow);
    }

    /* REJILLA DE TUTORIALES */
    .tutorials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.2rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-red);
      box-shadow: 0 6px 20px var(--primary-red-glow);
    }

    .card-tag {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-1: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 0.8rem;
    }

    /* VISOR DE ARTÍCULO COMPLETO */
    .reader-view {
      display: none;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .reader-view.active { display: block; }

    .reader-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .reader-title { font-size: 1.8rem; color: var(--text-main); }
    .close-btn {
      background-color: var(--primary-red);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .reader-body {
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .reader-body h3 {
      color: var(--accent-yellow);
      margin: 1.5rem 0 0.8rem 0;
    }

    .reader-body code {
      background-color: #0d0d10;
      color: #00ffcc;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: monospace;
      border: 1px solid var(--border-color);
    }

    .reader-body pre {
      background-color: #0d0d10;
      padding: 1rem;
      border-radius: 6px;
      border-left: 3px solid var(--primary-red);
      overflow-x: auto;
      margin: 1rem 0;
    }

    /* FOOTER */
    footer {
      background-color: #0b0b0e;
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Opti<span>Guide</span><span class="dot">.</span></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar tutorial (ej. FPS, Windows, RAM)..." oninput="filterTutorials()">
    </div>
  </header>

  <nav class="categories">
    <button class="cat-btn active" onclick="filterCategory('all', this)">Todos</button>
    <button class="cat-btn" onclick="filterCategory('Windows', this)">Windows</button>
    <button class="cat-btn" onclick="filterCategory('Juegos', this)">Juegos & FPS</button>
    <button class="cat-btn" onclick="filterCategory('Hardware', this)">Hardware</button>
    <button class="cat-btn" onclick="filterCategory('Redes', this)">Redes & Ping</button>
  </nav>

  <main>
    <!-- Contenedor para leer el tutorial seleccionado -->
    <section id="readerView" class="reader-view">
      <div class="reader-header">
        <div>
          <span id="readerTag" class="card-tag">CATEGORÍA</span>
          <h1 id="readerTitle" class="reader-title">Título del Tutorial</h1>
        </div>
        <button class="close-btn" onclick="closeReader()">✕ Cerrar</button>
      </div>
      <article id="readerContent" class="reader-body">
        <!-- El contenido detallado se carga dinámicamente -->
      </article>
    </section>

    <!-- Lista de tutoriales -->
    <h2 class="section-title">Guías de Optimización</h2>
    <div class="tutorials-grid" id="tutorialsGrid">
      <!-- Tarjetas insertadas por JavaScript -->
    </div>
  </main>

  <footer>
    <p>&copy; 2026 OptiGuide — Portal de Guías & Optimización Personal.</p>
  </footer>

  <script>
    // Banco de datos de tutoriales
    const tutorialsData = [
      {
        id: 1,
        title: "Optimizar el Plan de Energía en Windows 11 / 10",
        category: "Windows",
        desc: "Activa el modo de Máximo Rendimiento oculto para reducir la latencia del procesador.",
        time: "5 min de lectura",
        content: `
          <p>Windows aplica límites de consumo de energía por defecto que reducen la frecuencia del procesador. Sigue estos pasos para liberar el máximo rendimiento:</p>
          <h3>Paso 1: Abrir la consola</h3>
          <p>Presiona <code>Win + R</code>, escribe <code>cmd</code> y pulsa Enter.</p>
          <h3>Paso 2: Activar el Plan de Alto Rendimiento</h3>
          <p>Copia y pega el siguiente comando en la consola:</p>
          <pre>powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61</pre>
          <h3>Paso 3: Seleccionar el plan</h3>
          <p>Ve a <strong>Panel de Control > Opciones de Energía</strong> y selecciona el nuevo plan llamado <em>"Rendimiento Máximo"</em>.</p>
        `
      },
      {
        id: 2,
        title: "Reducir Input Lag en CS1.6 y Juegos FPS",
        category: "Juegos",
        desc: "Ajustes de registro y comandos de consola para mejorar la respuesta del ratón y pantalla.",
        time: "8 min de lectura",
        content: `
          <p>El input lag puede costar ms decisivos en partidas competitivas. Ajusta los siguientes valores:</p>
          <h3>Configuración de comandos en juego:</h3>
          <pre>m_rawinput 1\nfps_max 144\ncl_cmdrate 101\ncl_updaterate 101</pre>
          <h3>Desactivar aceleración en Windows:</h3>
          <p>Entra a Configuración del Mouse y desmarca la casilla <strong>"Mejorar la precisión del puntero"</strong>.</p>
        `
      },
      {
        id: 3,
        title: "Limpieza Segura de Archivos Temporales y Caché",
        category: "Windows",
        desc: "Libera varios gigabytes de almacenamiento y memoria RAM sin arriesgar datos personales.",
        time: "4 min de lectura",
        content: `
          <p>Limpiar la caché periódicamente evita tirones de congelamiento (stuttering) en sistemas con poca RAM.</p>
          <h3>Rutas a limpiar manualmente:</h3>
          <p>Usa <code>Win + R</code> y limpia los archivos dentro de estas tres carpetas:</p>
          <ul>
            <li><code>temp</code></li>
            <li><code>%temp%</code></li>
            <li><code>prefetch</code></li>
          </ul>
        `
      },
      {
        id: 4,
        title: "Optimización de DNS para bajar el Ping",
        category: "Redes",
        desc: "Cómo probar y cambiar a los servidores DNS más rápidos según tu ubicación geográfica.",
        time: "6 min de lectura",
        content: `
          <p>Los DNS de tu proveedor ISP suelen ser lentos. Utilizar DNS públicos mejora la resolución de dominios y la estabilidad de red.</p>
          <h3>Servidores recomendados:</h3>
          <p><strong>Cloudflare:</strong> <code>1.1.1.1</code> y <code>1.0.0.1</code></p>
          <p><strong>Google:</strong> <code>8.8.8.8</code> y <code>8.8.4.4</code></p>
        `
      }
    ];

    let currentCategory = 'all';

    const tutorialsGrid = document.getElementById('tutorialsGrid');
    const readerView = document.getElementById('readerView');
    const readerTitle = document.getElementById('readerTitle');
    const readerTag = document.getElementById('readerTag');
    const readerContent = document.getElementById('readerContent');

    // Renderizar tarjetas de tutoriales
    function renderTutorials(list) {
      tutorialsGrid.innerHTML = '';
      if (list.length === 0) {
        tutorialsGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No se encontraron tutoriales que coincidan con la búsqueda.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openReader(item);

        card.innerHTML = `
          <div>
            <span class="card-tag">${item.category}</span>
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <div class="card-footer">
            <span>⏱ ${item.time}</span>
            <span style="color: var(--accent-yellow);">Leer guía →</span>
          </div>
        `;
        tutorialsGrid.appendChild(card);
      });
    }

    // Abrir visor de guía
    function openReader(item) {
      readerTitle.textContent = item.title;
      readerTag.textContent = item.category;
      readerContent.innerHTML = item.content;
      readerView.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Cerrar visor
    function closeReader() {
      readerView.classList.remove('active');
    }

    // Filtrar por categoría
    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    // Filtrar por texto
    function filterTutorials() {
      applyFilters();
    }

    // Lógica combinada de filtrado
    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = tutorialsData.filter(item => {
        const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
        const matchesQuery = item.title.toLowerCase().includes(query) || 
                             item.desc.toLowerCase().includes(query) ||
                             item.category.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });
      renderTutorials(filtered);
    }

    // Inicialización
    renderTutorials(tutorialsData);
  </script>
</body>
</html>
